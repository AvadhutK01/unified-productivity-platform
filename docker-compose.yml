version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: unified_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: unified_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:6
    container_name: unified_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: unified_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unified_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - POSTGRES_URI=postgresql://user:password@postgres:5432/unified_db?schema=public
      - DATABASE_URL=postgresql://user:password@postgres:5432/unified_db?schema=public
      - MONGODB_URI=mongodb://user:password@mongodb:27017/unified_db?authSource=admin
    depends_on:
      - postgres
      - mongodb
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
